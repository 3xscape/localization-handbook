function prog(S){
 const impl=TASKS.filter(t=>(S.tasks[t.id]||{}).status==='done').length/TASKS.length;
 const cal=CALS.filter(c=>(S.cal[c.id]||{}).done).length/CALS.length;
 const hwq=['canivore','fixedloc','fixedang','pivot','tcam','backlash','cancoder','intr','extr','p6','llfw'];
 const hw=hwq.filter(q=>(S.ans[q]||'')!=='').length/hwq.length;
 const tested=TESTS.filter(t=>['passed','failed'].includes((S.tests[t.id]||{}).res)).length/TESTS.length;
 const passed=TESTS.filter(t=>(S.tests[t.id]||{}).res==='passed').length/TESTS.length;
 return{impl,cal,hw,tested,passed,ready:0.3*impl+0.3*cal+0.2*hw+0.2*passed}
}

function KFSim(){
 const [s,setS]=useState({ox:-0.3,oy:0.2,vx:0.35,vy:-0.1,so:0.30,sv:0.12,n:2,dis:0.10,rho:0.4});
 const u=(k,v)=>setS(p=>({...p,[k]:v}));
 const n=s.n,pts=Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n+0.7;return[s.vx+(n>1?s.dis*Math.cos(a):0),s.vy+(n>1?s.dis*Math.sin(a):0)]});
 const zx=pts.reduce((a,p)=>a+p[0],0)/n,zy=pts.reduce((a,p)=>a+p[1],0)/n;
 const neff=n/(1+(n-1)*s.rho);const sc=Math.sqrt(s.sv*s.sv/neff+(n>1?0.5*s.dis*s.dis:0));
 const K=s.so*s.so/(s.so*s.so+sc*sc);const fx=s.ox+K*(zx-s.ox),fy=s.oy+K*(zy-s.oy);const sf=Math.sqrt((1-K)*s.so*s.so);
 const q=s.so*s.so,r=sc*sc,Kw=q/(q+Math.sqrt(q*r));
 const P=120,cx=260,cy=170,X=x=>cx+x*P,Y=y=>cy-y*P;
 return <div className="card"><h4 style={{marginTop:0}}>Interactive Kalman fusion simulator <Tag k="sim"/></h4><SimNote>Scalar-per-axis illustration of a Kalman update (P and R diagonal, H = I). It is not the exact code path of any library.</SimNote>
 <div className="g2"><div>
  <div className="g2"><div><Sl label="Odometry X (m)" v={s.ox} set={v=>u('ox',v)} min={-1.5} max={1.5}/><Sl label="Odometry Y (m)" v={s.oy} set={v=>u('oy',v)} min={-1.5} max={1.5}/><Sl label="Odometry σ (m)" g="processnoise" v={s.so} set={v=>u('so',v)} min={0.02} max={1}/></div>
  <div><Sl label="Vision X (m)" v={s.vx} set={v=>u('vx',v)} min={-1.5} max={1.5}/><Sl label="Vision Y (m)" v={s.vy} set={v=>u('vy',v)} min={-1.5} max={1.5}/><Sl label="Vision σ per camera (m)" g="measnoise" v={s.sv} set={v=>u('sv',v)} min={0.02} max={1}/></div></div>
  <Sl label="Number of cameras" v={s.n} set={v=>u('n',v)} min={1} max={3} step={1} dp={0}/><Sl label="Camera disagreement (m)" v={s.dis} set={v=>u('dis',v)} min={0} max={0.6}/><Sl label="Camera error correlation ρ" g="neff" v={s.rho} set={v=>u('rho',v)} min={0} max={1}/>
 </div><div>
  <svg viewBox="0 0 520 340" className="svgbox"><line x1="0" y1={cy} x2="520" y2={cy} stroke="#1a2740"/><line x1={cx} y1="0" x2={cx} y2="340" stroke="#1a2740"/>
   <circle cx={X(s.ox)} cy={Y(s.oy)} r={s.so*P} fill="#ff9b4a22" stroke="#ff9b4a"/><circle cx={X(zx)} cy={Y(zy)} r={sc*P} fill="#26d6f022" stroke="#26d6f0"/>
   <circle cx={X(fx)} cy={Y(fy)} r={Math.max(2,sf*P)} fill="#3ddc9733" stroke="#3ddc97"/>
   {pts.map((p,i)=><circle key={i} cx={X(p[0])} cy={Y(p[1])} r="4" fill="#26d6f0"/>)}
   <circle cx={X(s.ox)} cy={Y(s.oy)} r="5" fill="#ff9b4a"/><circle cx={X(fx)} cy={Y(fy)} r="6" fill="#3ddc97" stroke="#fff"/>
   <text x="8" y="16" fontSize="11" fill="#ff9b4a">● odometry ± σ</text><text x="8" y="30" fontSize="11" fill="#26d6f0">● cameras / combined vision ± σ</text><text x="8" y="44" fontSize="11" fill="#3ddc97">● fused ± σ</text></svg>
 </div></div>
 <div className="g4" style={{marginTop:8}}>
  <div className="card"><div className="kpil">Fused position</div><b>({f(fx)}, {f(fy)}) m</b></div>
  <div className="card"><div className="kpil">Weights</div>Odometry <b>{f((1-K)*100,0)}%</b> · Vision <b>{f(K*100,0)}%</b>{n>1&&<div style={{fontSize:12,color:'var(--mu)'}}>each camera ≈ {f(K/n*100,0)}%</div>}</div>
  <div className="card"><div className="kpil">Fused σ / combined vision σ</div><b>{f(sf,3)} / {f(sc,3)} m</b><div style={{fontSize:12,color:'var(--mu)'}}>n_eff = {f(neff,2)} of {n}</div></div>
  <div className="card"><div className="kpil">Gain: full KF vs WPILib-style steady-state</div><b>{f(K,2)} vs {f(Kw,2)}</b><div style={{fontSize:12,color:'var(--mu)'}}>Illustrative; verify WPILib formula in source</div></div></div>
 <p style={{fontSize:13,color:'var(--mu)'}}>Notice: at ρ=1 extra cameras give no extra confidence (n_eff=1). Real cameras share Pigeon heading, field map and tag layout, so ρ&gt;0.</p></div>}

function Fusion(){
 return <div><PH title="Sensor Fusion and Kalman Filters" sub="How odometry and vision are combined into one pose, at student and advanced levels."/>
 <St><p>Odometry is like counting your steps in the dark: smooth and quick, but errors pile up. Vision is like glancing at a landmark: it has no drift but is noisy and arrives late. A Kalman filter is the rule for blending them: trust each in proportion to how certain it is.</p></St>
 <h3>Mathematical model</h3>
 <Eq>{`State          x = [X, Y, θ]ᵀ
Predict        x̂⁻ = f(x_prev, odometry)
Covariance     P⁻ = F P Fᵀ + Q
Innovation     e  = z_vision − H x̂⁻
Innov. cov.    S  = H P⁻ Hᵀ + R
Kalman gain    K  = P⁻ Hᵀ S⁻¹
Correct        x̂  = x̂⁻ + K e          P = (I − K H) P⁻`}</Eq>
 <div className="g3">{[['Process noise Q','processnoise','Grows P each step: wheel slip, scrub, radius error.'],['Measurement noise R','measnoise','Vision variance; from distance, tag count, motion, calibration.'],['Covariance P','covariance','The filter’s own belief about its uncertainty.'],['Innovation','innovation','Measurement minus prediction.'],['Kalman gain','kalmangain','Trust ratio between prediction and measurement.'],['Latency compensation',null,'Look up the state at the capture time, apply the correction there, then replay odometry to now.']].map(([t,g,d])=><div className="card" key={t}><b>{g?<Tip g={g}>{t}</Tip>:t}</b><p style={{margin:'4px 0 0',fontSize:13.5}}>{d}</p></div>)}</div>
 <Ad><p><b>Historical state correction:</b> an observation stamped t₀ corrects the state at t₀ and the delta since t₀ (odometry increments) is re-applied. Mechanical Advantage-style estimators keep a timestamped pose buffer and apply a gain on the pose offset; WPILib’s <code>SwerveDrivePoseEstimator.addVisionMeasurement</code> does the same by replaying stored odometry.</p><p><b>Odometry drift</b> is unbounded (random walk); vision uncertainty is bounded but time-correlated. Covariance propagation lets the filter notice that after a bump P should inflate, so vision automatically gets more weight.</p></Ad>
 <Wn t="Important distinction">WPILib’s standard pose estimator uses a simplified, <i>steady-state</i> gain computed once from the std-dev vectors — it is not a full dynamically adaptive covariance EKF, and it does not propagate P per-update. Recommended path: start with the CTRE or WPILib estimator as baseline; build a custom adaptive EKF only if experiments show a measurable gain.</Wn>
 <h3>Estimator comparison</h3>
 <Table head={['Approach','Covariance','Latency comp.','Effort','Notes']} rows={[
 ['WPILib SwerveDrivePoseEstimator','Fixed steady-state gain from std-dev vectors','Yes (replay)','Low','Baseline. Per-measurement std devs but no P propagation.'],
 ['CTRE Phoenix 6 built-in (SwerveDrivetrain)','Similar WPILib-based; runs in odometry thread','Yes — expects CTRE timebase','Lowest','Best if already using Tuner X swerve. Verify behaviour for installed version.'],
 ['Mechanical Advantage RobotState','Custom Kalman-style per-observation updates','Yes (pose + orientation buffers)','Medium–High','Source-reading recommended (see research page).'],
 ['Custom adaptive EKF','Full P, Q, R, Mahalanobis gating','Own implementation','High','Only after baseline measured.'],
 ['Weighted least squares odometry','Per-module weights from slip residuals','n/a','Medium','Improves odometry input to any estimator.'],
 ['Factor-graph (optional research)','Joint smoothing over a window','Natural','Very high','GTSAM-style; research only.']]}/>
 <KFSim/></div>}

 <div className="card"><h4 style={{marginTop:0}}>Recommended starting configuration <Tag k="proposed"/></h4><ul className="t">

function Turret(){
 const {S,set}=useApp();const g=S.geo;
 const [rb,setRb]=useState({x:5.5,y:3.2,h:25,t:40,pr:0,rl:0,zoom:2.5});const u=(k,v)=>setRb(p=>({...p,[k]:v}));
 const [lat,setLat]=useState(60),[tr,setTr]=useState(120),[dist,setDist]=useState(4);
 const sg=k=>v=>set('geo.'+k,v);
 const pz=0.35;
 const FR=M.mul(M.T(rb.x,rb.y,0),M.rpy(rb.rl*D2R,rb.pr*D2R,rb.h*D2R));
 const RP=M.T(N(g.pivotX),N(g.pivotY),pz),TRm=M.rpy(0,0,rb.t*D2R),TC=M.mul(M.T(N(g.tcX),N(g.tcY),N(g.tcZ)),M.rpy(0,-N(g.tcPitch)*D2R,N(g.tcYaw)*D2R));
 const RC=M.mul(M.mul(RP,TRm),TC);const FC=M.mul(FR,RC);const back=M.mul(FC,M.inv(RC));
 const RC0=M.mul(M.mul(RP,M.rpy(0,0,0)),TC);const naive=M.mul(FC,M.inv(RC0));

 const rt=rb.h*D2R;const rob=[[0.4,0.4],[0.4,-0.4],[-0.4,-0.4],[-0.4,0.4]].map(p=>[rb.x+p[0]*Math.cos(rt)-p[1]*Math.sin(rt),rb.y+p[0]*Math.sin(rt)+p[1]*Math.cos(rt)]);

FieldToRobot     = FieldToCamera × inverse(RobotToCamera(t))`}</Eq>

const BSTATES=['NORMAL','BUMP_CROSSING','COLLISION_OR_SLIP','RECOVERY'];
function bumpRun(P,scn,appr,accum,recov){
 const dt=0.005,T=2.5,v=3,t0=0.8,D=0.5,tc=1.0;let st=0,settle=0,good=0;let eA=0,eB=0,eC=0,eGate=0,eRec=0,dumpBuf=0,wasSup=false;
 const out={t:[],pitch:[],roll:[],state:[],A:[],B:[],C:[],fg:[],fr:[],acc:[]};let evt=null,recG=null,recR=null,nextVis=0;
 for(let t=0;t<=T+1e-9;t+=dt){
  let pitch=0,roll=0,acc=0.0,rate=0,step=0;
  if(scn==='bump'&&t>=t0&&t<t0+D){const ph=2*Math.PI*(t-t0)/D;pitch=P.amp*Math.sin(ph);roll=P.rollAmp*Math.sin(ph+1);if(Math.abs(pitch)>5)rate=P.slip*v}
  if(scn==='collision'){if(t>=tc&&t<tc+0.05)acc=P.accelPk;if(t>=tc&&t<tc+0.12)rate=P.slip*v*0.8;}
  const tilt=Math.max(Math.abs(pitch),Math.abs(roll));
  const hit=tilt>Math.min(P.pt,P.rt)||acc>P.accelThr;
  const prev=st;
  if(st===0){if(Math.abs(pitch)>P.pt||Math.abs(roll)>P.rt)st=1;else if(acc>P.accelThr)st=2}
  else if(st===1||st===2){const calm=tilt<P.ret&&acc<P.accelThr;if(calm)settle+=dt*1000;else settle=0;if(settle>=P.settle){st=3;settle=0;good=0}}
  else if(st===3){if(Math.abs(pitch)>P.pt||Math.abs(roll)>P.rt)st=1;else if(acc>P.accelThr)st=2}
  if(st!==0&&prev===0&&evt===null)evt=t;
  const sup=st===1||st===2;
  eA+=rate*dt;
  if(sup){eB+=v*dt;dumpBuf+=rate*dt}else{if(wasSup&&accum){eB+=dumpBuf}dumpBuf=0;eB+=rate*dt}
  if(accum&&sup){eB-=v*dt}
  wasSup=sup;
  eC+=rate*(1-P.wq)*dt;
  const base=appr==='none'?rate*dt:appr==='suppress'?(sup?v*dt:rate*dt):rate*(1-P.wq)*dt;
  eGate+=base;eRec+=base;
  if(t>=nextVis){nextVis+=0.05;const vgood=!sup&&tilt<P.ret;
   if(vgood){const inn=Math.abs(eGate);if(inn<P.gate)eGate-=P.K*eGate;
    const inr=Math.abs(eRec);if(st===3){good++;if(good>=P.nrec){eRec-=0.8*eRec}else eRec-=P.K*eRec}else if(inr<P.gate)eRec-=P.K*eRec}
   if(st===3&&good>=P.nrec&&P.recoverToNormal!==false){st=0;good=0}}
  if(evt!==null&&t>evt+0.02){if(recG===null&&Math.abs(eGate)<0.05&&!sup&&st!==1)recG=t-evt;if(recR===null&&Math.abs(eRec)<0.05&&!sup&&st!==1)recR=t-evt}
  if(Math.round(t/dt)%4===0){out.t.push(t);out.pitch.push(pitch);out.roll.push(roll);out.state.push(st);out.A.push(Math.abs(eA));out.B.push(Math.abs(eB));out.C.push(Math.abs(eC));out.fg.push(Math.abs(eGate));out.fr.push(Math.abs(eRec));out.acc.push(acc)}
 }
 out.evt=evt;out.recG=recG;out.recR=recR;return out}
function SlipViz(){
 const {S}=useApp();const a=N(S.hw.halfSpan);const [c,setC]=useState({vx:2.0,vy:0.5,w:1.0,s1:1,s2:1,s3:1,s4:1,cm:1,e0:0.3,src:'indep'});const u=(k,v)=>setC(p=>({...p,[k]:v}));
 const mods=[[a,a],[a,-a],[-a,-a],[-a,a]];const sc=[c.s1,c.s2,c.s3,c.s4];
 const vh=mods.map(([rx,ry])=>[c.vx-c.w*ry,c.vy+c.w*rx]);
 const vm=vh.map((p,i)=>[p[0]*sc[i]*c.cm,p[1]*sc[i]*c.cm]);
 const wls=(wt)=>{// solve [vx,vy,w] by weighted LS on measured module velocities
  let A=[[0,0,0],[0,0,0],[0,0,0]],b=[0,0,0];mods.forEach(([rx,ry],i)=>{const w=wt[i];const rows=[[[1,0,-ry],vm[i][0]],[[0,1,rx],vm[i][1]]];rows.forEach(([r,z])=>{for(let p=0;p<3;p++){b[p]+=w*r[p]*z;for(let q=0;q<3;q++)A[p][q]+=w*r[p]*r[q]}})});
  const d=(m)=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);const D=d(A)||1e-9;
  return[0,1,2].map(k=>{const Ak=A.map((r,i)=>r.map((x,j)=>j===k?b[i]:x));return d(Ak)/D})};
 const ref=c.src==='indep'?[c.vx,c.vy,c.w]:wls([1,1,1,1]);
 const rh=mods.map(([rx,ry])=>[ref[0]-ref[2]*ry,ref[1]+ref[2]*rx]);
 const res=vm.map((p,i)=>Math.hypot(p[0]-rh[i][0],p[1]-rh[i][1]));
 const wt=res.map(e=>1/(1+(e/c.e0)**2));const west=wls(wt),uw=wls([1,1,1,1]);
 const P=75,cx=190,cy=170;
 return <div className="card"><h4 style={{marginTop:0}}>Per-module slip detection <Tag k="sim"/></h4><SimNote>Kinematic residuals on synthetic inputs.</SimNote>
 <Eq>{`v_ix = v_i cos(α_i)    v_iy = v_i sin(α_i)
v̂_ix = v_x − ω r_iy     v̂_iy = v_y + ω r_ix
e_i = √((v_ix − v̂_ix)² + (v_iy − v̂_iy)²)`}</Eq>

 <Sel label="Reference chassis velocity source" v={c.src} set={v=>u('src',v)} opts={[['indep','Independent (IMU / commanded)'],['self','Derived from the wheels themselves']]}/></div>
 <svg viewBox="0 0 380 340" className="svgbox"><rect x={cx-a*P} y={cy-a*P} width={2*a*P} height={2*a*P} fill="#14213a" stroke="#5aa9ff"/>
  {mods.map(([rx,ry],i)=>{const X=cx+rx*P,Y=cy-ry*P,k=34;return <g key={i}><circle cx={X} cy={Y} r="9" fill="#0b1426" stroke={wt[i]>0.7?'#3ddc97':wt[i]>0.35?'#ff9b4a':'#ff7a7a'} strokeWidth="2"/><text x={X} y={Y+3} textAnchor="middle" fontSize="9" fill="#fff">{i+1}</text>
   <line x1={X} y1={Y} x2={X+rh[i][0]*k} y2={Y-rh[i][1]*k} stroke="#3ddc97" strokeWidth="2"/><line x1={X} y1={Y} x2={X+vm[i][0]*k} y2={Y-vm[i][1]*k} stroke="#ff9b4a" strokeWidth="2" strokeDasharray="4 2"/>
   <text x={X+(rx>0?12:-12)} y={Y+(ry>0?-18:26)} textAnchor={rx>0?'start':'end'} fontSize="10" fill="#e8eef9">e={f(res[i],2)} w={f(wt[i],2)}</text></g>})}
  <text x="8" y="14" fontSize="10" fill="#3ddc97">— predicted</text><text x="8" y="28" fontSize="10" fill="#ff9b4a">- - measured</text></svg></div>
 <p>Chassis velocity truth ({f(c.vx)}, {f(c.vy)}, ω {f(c.w)}) · plain wheel fit ({f(uw[0])}, {f(uw[1])}, {f(uw[2])}) · weighted fit ({f(west[0])}, {f(west[1])}, {f(west[2])}).</p>

function Bump(){
 const [P,setP]=useState({pt:8,rt:8,ret:4,settle:150,nrec:3,amp:12,rollAmp:4,slip:0.35,wq:0.7,gate:0.3,K:0.15,accelThr:2.5,accelPk:3.5});

 <Code title="BumpDetector sketch" code={`enum LocState { NORMAL, BUMP_CROSSING, COLLISION_OR_SLIP, RECOVERY }\nLocState update(double pitchDeg, double rollDeg, double accelG, double now) {\n  boolean tilted = Math.abs(pitchDeg) > PITCH_THRESH || Math.abs(rollDeg) > ROLL_THRESH;\n  boolean calm = Math.abs(pitchDeg) < RETURN_TILT && Math.abs(rollDeg) < RETURN_TILT && accelG < ACCEL_THRESH;\n  switch (state) {\n    case NORMAL -> { if (tilted) state = BUMP_CROSSING; else if (accelG > ACCEL_THRESH || slip) state = COLLISION_OR_SLIP; }\n    case BUMP_CROSSING, COLLISION_OR_SLIP -> { if (calm && now - calmSince > SETTLE_S) { state = RECOVERY; goodFrames = 0; } else if (!calm) calmSince = now; }\n    case RECOVERY -> { if (tilted) state = BUMP_CROSSING; else if (goodFrames >= 3) state = NORMAL; }\n  }\n  return state;\n}\n// In BUMP_CROSSING/COLLISION: skip translation from odometry (drop it - do NOT buffer it), keep gyro heading.`}/></div>}

function Sigma(){
 const [c,setC]=useState({type:'fixed',d:3,tags:2,area:0.6,head:0.2,v:2,cav:0,tv:0,ts:10,cal:3,cmult:1,tun:0.3,mt:'mt2',kd:0.035});const u=(k,v)=>setC(p=>({...p,[k]:v}));
 const base=c.type==='fixed'?0.04:0.10;const sd=c.kd*c.d*c.d/Math.sqrt(Math.max(1,c.tags));
 const areaF=Math.max(1,Math.sqrt(0.5/Math.max(c.area,0.01)));
 const sh=c.mt==='mt2'?c.d*Math.tan(c.head*D2R):c.d*Math.tan(c.head*D2R)*2;
 const tsU=c.ts/1000;const sm=c.v*tsU+c.d*(c.cav*D2R)*tsU;const st=c.type==='turret'?c.d*(c.tv*D2R)*(tsU+0.02)+c.d*Math.tan(c.tun*D2R):0;
 const se=Math.sqrt((c.cal/1000)**2+(c.d*Math.tan(c.cal*0.05*D2R))**2);
 const parts=[['base',base],['distance',sd],['heading',sh],['motion',sm],['turret',st],['extrinsics',se]];
 const tot=c.cmult*areaF*Math.sqrt(parts.reduce((a,p)=>a+p[1]*p[1],0));
 const conf=Math.exp(-tot/0.5);const reject=(c.type==='turret'&&c.tun>1.5)||tot>0.9||c.tags<1;
 const headStd=c.mt==='mt2'?'∞ (999999)':f(Math.max(0.02,tot/Math.max(c.d,0.5)),3)+' rad';
 return <div className="card"><h4 style={{marginTop:0}}>Vision uncertainty calculator <Tag k="proposed"/></h4>
 <Eq>{`σ_vision = √(σ_base² + σ_distance² + σ_heading² + σ_motion² + σ_extrinsics²)
σ_distance = k_d · d² / √tagCount     σ_heading ≈ d · headingUncertaintyRad
σ_motion ≈ RobotSpeed · TimestampUncertainty`}</Eq>
 <div className="g3"><div><Sel label="Camera type" v={c.type} set={v=>u('type',v)} opts={[['fixed','Fixed'],['turret','Turret']]}/><Sel label="Algorithm" v={c.mt} set={v=>u('mt',v)} opts={[['mt2','MegaTag2'],['mt1','MegaTag1']]}/><Sl label="Tag distance (m)" v={c.d} set={v=>u('d',v)} min={0.5} max={8} step={0.1} dp={1}/><Sl label="Tag count" v={c.tags} set={v=>u('tags',v)} min={0} max={6} step={1} dp={0}/><Sl label="Tag area (% of image)" v={c.area} set={v=>u('area',v)} min={0.05} max={5} step={0.05}/></div>
 <div><Sl label="Heading uncertainty (°)" v={c.head} set={v=>u('head',v)} min={0} max={3} step={0.05}/><Sl label="Robot velocity (m/s)" v={c.v} set={v=>u('v',v)} min={0} max={5} step={0.1} dp={1}/><Sl label="Camera angular velocity (°/s)" v={c.cav} set={v=>u('cav',v)} min={0} max={720} step={10} dp={0}/><Sl label="Turret angular velocity (°/s)" v={c.tv} set={v=>u('tv',v)} min={0} max={400} step={5} dp={0}/><Sl label="Turret angle uncertainty (°)" v={c.tun} set={v=>u('tun',v)} min={0} max={3} step={0.05}/></div>
 <div><Sl label="Timestamp uncertainty (ms)" v={c.ts} set={v=>u('ts',v)} min={0} max={80} step={1} dp={0}/><Sl label="Calibration uncertainty (mm; ×0.05 → deg)" v={c.cal} set={v=>u('cal',v)} min={0} max={20} step={0.5} dp={1}/><Sl label="Camera confidence multiplier" v={c.cmult} set={v=>u('cmult',v)} min={0.5} max={4} step={0.1} dp={1}/><Sl label="k_d" v={c.kd} set={v=>u('kd',v)} min={0.005} max={0.1} step={0.005} dp={3}/></div></div>
 <div className="g4"><div className="card"><div className="kpil">σ X</div><b>{f(tot,3)} m</b></div><div className="card"><div className="kpil">σ Y</div><b>{f(tot,3)} m</b><div style={{fontSize:11,color:'var(--mu)'}}>isotropic here</div></div><div className="card"><div className="kpil">σ heading</div><b>{headStd}</b></div><div className="card"><div className="kpil">Confidence</div><b>{f(conf,2)}</b><br/>{reject?<Tag k="failed">REJECT</Tag>:<Tag k="passed">ACCEPT</Tag>}</div></div>

 <div><h4>Correlation and anisotropy</h4><p style={{fontSize:14}}>Cameras are <b>not independent</b>: shared Pigeon heading, field map, tags and similar calibration biases. Use <Tip g="neff">n_eff = n/(1+(n−1)ρ)</Tip> to inflate combined uncertainty; with ρ≈0.5, three cameras ≈ 1.5 independent ones.</p><p style={{fontSize:14}}><Tip g="anisotropic">Anisotropic covariance</Tip>: range along the viewing axis is typically worse than lateral position (or vice-versa for heading-driven error). WPILib std-dev vectors are per-axis in the field frame, so you can only approximate this by rotating the σ ellipse yourself (custom EKF) or inflating the worse axis.</p></div></div></div>}

function genObs(seed,R,n){const r=rng(seed);const obs=[];let t=0;for(let i=0;i<n;i++){t+=0.05;const cam=i%3;const o={i,t,cam,tags:r()<0.1?0:1+Math.floor(r()*4),dup:r()<0.06,age:0.03+r()*0.1+(r()<0.05?1:0),inHist:!(cam===2&&r()<0.07),nan:r()<0.02,imp:r()<0.03,out:r()<0.04,camAv:r()<0.07?900:r()*200,chAv:r()<0.05?700:r()*100,area:r()<0.1?0.05:0.3+r()*2,amb:r()<0.08?0.9:r()*0.3,tmiss:cam===2&&r()<0.06,tunc:cam===2?(r()<0.12?2.5:0.4):0,conn:!(cam===1&&i>=18&&i<26),mis:r()<0.02,noise:Math.abs(gauss(r))*0.05,garbage:r()<0.05};obs.push(o)}return obs}
function runFilter(obs,R,recoveryOn,bumpAt){
 let off=0,since=0,good=0,res=[];
 obs.forEach(o=>{if(o.i===bumpAt)off=0.55;
  const reason=[];
  if(o.tags===0)reason.push('No visible tags');if(!o.conn&&R.conn)reason.push('Disconnected camera');if(o.dup&&R.dup)reason.push('Duplicate frame');if(o.age>R.maxAge&&R.stale)reason.push('Stale timestamp');
  if(!o.inHist&&R.hist)reason.push('Timestamp outside history');if(o.nan&&R.nan)reason.push('Invalid numbers');if(o.imp&&R.imp)reason.push('Impossible position');if(o.out&&R.field)reason.push('Outside field');
  if(o.camAv>R.camAv&&R.av)reason.push('Excess camera ang. velocity');if(o.chAv>R.chAv&&R.av)reason.push('Excess chassis ang. velocity');if(o.tags===1&&o.amb>R.amb&&R.amb_on)reason.push('High single-tag ambiguity');
  if(o.area<R.area&&R.areaOn)reason.push('Low tag area');if(o.tmiss&&R.tmiss)reason.push('Missing turret angle');if(o.tunc>R.tunc&&R.tunOn)reason.push('Turret angle uncertainty');if(o.mis&&R.mis)reason.push('Known misplaced tag');
  const innov=o.garbage?1.5+o.noise*5:off+o.noise;
  let accepted=reason.length===0;let note='';
  const hq=o.tags>=2&&!o.garbage&&reason.length===0;
  if(accepted&&innov>R.gate&&R.gateOn){accepted=false;
   if(recoveryOn&&hq){good++;if(good>=3){accepted=true;note='recovery accept'}else reason.push('Disagreement (recovery confirming '+good+'/3)')}else{good=0;reason.push('Excess disagreement with prediction')}}
  else if(accepted&&innov<=R.gate)good=0;
  if(accepted){since=0;off*=(note?0.08:0.7)}else since++;
  res.push({...o,innov,accepted,reason:reason.join('; '),off,conf:clamp(Math.exp(-off/0.3)*Math.exp(-since*0.03),0,1),note})});return res}
function Filtering(){
 const [R,setR]=useState({conn:1,dup:1,stale:1,maxAge:0.5,hist:1,nan:1,imp:1,field:1,av:1,camAv:720,chAv:540,amb_on:1,amb:0.7,areaOn:1,area:0.1,tmiss:1,tunOn:1,tunc:1.5,mis:1,gateOn:1,gate:0.3});const [rec,setRec]=useState(true),[seed,setSeed]=useState(7);const u=(k,v)=>setR(p=>({...p,[k]:v}));
 const obs=useMemo(()=>genObs(seed,R,70),[seed]);const res=useMemo(()=>runFilter(obs,R,rec,30),[obs,R,rec]);
 const acc=res.filter(r=>r.accepted).length;const cnt={};res.filter(r=>!r.accepted).forEach(r=>r.reason.split('; ').forEach(x=>{const k=x.replace(/ \(.*/,'');cnt[k]=(cnt[k]||0)+1}));

/* TOF */
function solveShot(d,hr,ht,T,Vr){const vx=d/T-Vr,vz=(ht-hr)/T+4.905*T;return{vx,vz,v:Math.hypot(vx,vz),th:Math.atan2(vz,vx),T}}

function Testing(){

 <div className="row noprint"><ExportBox title="Export results (JSON)" text={JSON.stringify(S.tests,null,1)}/><ExportBox title="Export results (CSV)" text={csv}/>{['all','none','inprogress','passed','failed'].map(k=><button key={k} className={'btn alt'+(flt===k?' on':'')} onClick={()=>setF(k)}>{k==='none'?'not run':k}</button>)}</div>

function refUrl(label){const m=label.match(/^Team(\d+) (.+)$/);if(m){const s=SOURCES.find(x=>x.t.includes(m[1])&&x.t.includes(m[2]));if(s)return label+' — '+s.u}const o=SOURCES.find(x=>x.t.includes(label.replace(/^Team/,'')));return o?label+' — '+o.u:label}
function buildPrompt(S,feats){
 const h=S.hw,a=k=>(S.ans[k]||'')===''?'UNKNOWN — inspect the codebase / ask the team':S.ans[k];
 let o=`# Task: implement FRC 2026 (REBUILT) localization features in OUR EXISTING robot codebase\n\n## Before you change anything\n- Inspect the existing codebase first (build files, WPILib/Phoenix 6/LimelightHelpers/AdvantageKit versions, drivetrain, vision, turret, shooter). Summarise what exists before modifying it.\n- Preserve working subsystems. Make the smallest change that meets the requirements.\n- There must be exactly ONE authoritative pose estimator. Do NOT create a redundant estimator if the CTRE swerve drivetrain already maintains one; add a RobotState facade instead.\n- Use APIs compatible with the versions actually in this project (verify signatures; do not guess).\n\n## Our hardware\n- Swerve: 4 modules, CTRE Phoenix 6, CANivore CAN FD, Pigeon 2.0. Drive ${h.driveGear}:1, steer ${h.steerGear}:1, coupling ${h.coupling}. Target odometry ${h.odoHz} Hz (verify CAN FD bandwidth).\n- Vision: 3× Limelight 4. #1 and #2 chassis-fixed, ~180° apart, MegaTag2 primary. #3 on rotating turret (dynamic transform from Team 341; MegaTag2 only if validated; MegaTag1 alternative); LL4 has internal IMU.\n${S.cams.map(c=>`  - ${c.name}: offset (${f(N(c.x),3)}, ${f(N(c.y),3)}, ${f(N(c.z),3)}) m, roll/pitch(up)/yaw ${f(N(c.roll),1)}/${f(N(c.pitch),1)}/${f(N(c.yaw),1)}°, pipeline ${c.pipeline}, IMU mode ${c.imuMode} — geometry PLACEHOLDER unless team confirmed`).join('\n')}\n- Turret: Kraken, ${h.turretRatio}:1, ±180° (~30.2 motor rotations each way), motor-encoder only, backlash present. Pivot (${S.geo.pivotX}, ${S.geo.pivotY}) m (placeholder). Consider an output-side CANcoder.\n- Shooter: 2× Kraken X60, ${f(N(h.flyDia)*39.37,0)}-inch flywheels 1:1, adjustable hood (encoder 0–0.4; ~0 = near-vertical), release height ${h.releaseH} m. Only ONE validated shot: ~3.3 m, 9 V, hood 0.200. Preliminary shot map (NOT validated): ${S.shotMap.map(r=>`${r[0]}m/${r[1]}V/${r[2]}`).join(', ')}.\n\n## Team answers (unknown = do not assume)\n${QS.map(q=>`- ${q[1].replace(/\?.*/,'')}: ${a(q[0])}`).join('\n')}\n`;
 const one=fe=>`### ${fe.t}\nRequirements:\n${fe.req.map(x=>'- '+x).join('\n')}\n${fe.eq.length?'Equations:\n'+fe.eq.map(x=>'    '+x).join('\n')+'\n':''}Reference sources to investigate (read the real source; do not assume a team implements something because it was listed):\n${fe.files.map(x=>'- '+refUrl(x)).join('\n')}\nLogging: AdvantageKit keys under Localization/, Vision/, Gyro/, Turret/, Shooter/ as relevant (see key list below).\nSafety checks: reject NaN/out-of-field poses; never command turret or shooter from an invalid pose without a fallback; keep MegaTag2 heading std dev ≈ 999999; never apply dynamic camera transform twice; never use current turret angle for an older frame.\nTesting: unit tests for pure math (buffers, transforms, noise model); simulation/replay where possible; hardware tests listed in the acceptance criteria.\nAcceptance criteria:\n${fe.acc.map(x=>'- '+x).join('\n')}\n`;
 o+='\n## Selected features\n'+feats.map(one).join('\n');
 o+=`\n## Global requirements\n- Log keys: ${LOGKEYS.map(k=>k[0]).join(', ')}.\n- Timestamps: image capture time converted to the estimator timebase exactly once (Utils.fpgaToCurrentTime for CTRE); process vision chronologically; keep ~2 s history.\n- Proposed starting targets (unvalidated): static median ≤2 cm, p95 ≤5 cm, moving p95 ≤10 cm, heading ≤0.5°, post-bump recovery ≤0.25 s.\n- Do not fabricate performance numbers. Report what you changed, what you could not verify, and which hardware tests the team must run.\n`;return o}

es','Sources and Documentation',Sources,'links references glossary verification'],['prompts','Claude Code Prompt Generator',Prompts,'prompt claude code features']];
